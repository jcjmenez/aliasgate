[project]
name = "aliasgate"
version = "0.2.0"
description = "Reversible pseudonymization gateway for LLM APIs: the model never sees real customer data, the user never sees placeholders."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Juan Carlos Jiménez" }]
keywords = ["llm", "privacy", "pii", "pseudonymization", "gateway", "proxy", "gdpr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "phonenumbers>=9.0.43",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aliasgate = "aliasgate.cli:main"

[project.urls]
Homepage = "https://github.com/jcjmenez/aliasgate"
Documentation = "https://github.com/jcjmenez/aliasgate/blob/main/docs/usage.md"
Changelog = "https://github.com/jcjmenez/aliasgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ml = [
    "gliner>=0.2.30",
    "protobuf>=7.36.2",
    # gliner needs torch anyway; it is listed so that uv takes it from the CPU index on Linux.
    "torch>=2.15.0",
]

[dependency-groups]
dev = [
    "faker>=40.54.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=5.0",
    "respx>=0.23.1",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv.sources]
# PyPI's Linux torch wheels pull in CUDA (about 6 GB installed); the detector runs on CPU.
# This applies to uv (checkouts, the Docker image), not to `pip install 'aliasgate[ml]'`.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aliasgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools"]
# Code blocks in the docs are interface sketches, not source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# Shared test doubles (tests/fakes.py) and the corpus generator (tools/) are importable from
# every test directory.
pythonpath = ["tests", "tools"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ml: tests that need the optional ML extra and download a model (deselected in default CI)",
]

[tool.coverage.run]
source = ["aliasgate"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
