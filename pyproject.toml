[project]
name = "aliasgate"
version = "0.0.1"
description = "Reversible pseudonymization gateway for LLM APIs: the model never sees real customer data, the user never sees placeholders."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Juan Carlos Jiménez" }]
keywords = ["llm", "privacy", "pii", "pseudonymization", "gateway", "proxy", "gdpr"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aliasgate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Code blocks in the docs are interface sketches, not source files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "ml: tests that need the optional ML extra and download a model (deselected in default CI)",
]

[tool.coverage.run]
source = ["aliasgate"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
