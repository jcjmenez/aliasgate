# Release: pushing a tag vX.Y.Z runs the CI checks, publishes the package to PyPI with trusted
# publishing (OIDC, no stored token), pushes the images ghcr.io/<owner>/aliasgate:X.Y.Z and
# :X.Y.Z-ml, and creates a GitHub release with the changelog section of X.Y.Z.
#
# Before the first tag, the maintainer configures by hand:
#   1. On PyPI, a (pending) trusted publisher for project "aliasgate": this repository, workflow
#      "release.yml", environment "pypi".
#   2. In the repository settings, an environment named "pypi" (optionally with required
#      reviewers and a rule that only v* tags may deploy to it).
# To release: set the version in pyproject.toml and aliasgate/__init__.py, move the changelog's
# Unreleased entries under the new version, merge, then push the tag vX.Y.Z from main.
#
# Third-party actions are pinned by commit; the comment names the release.

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26"
      - name: Check that the tag names the package version
        id: version
        run: |
          version="$(uv version --short)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the package version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aliasgate/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing: PyPI exchanges this OIDC token; nothing is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  images:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - extras: ""
            suffix: ""
          - extras: ml
            suffix: "-ml"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }} # the job's own short-lived token
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.image.outputs.name }}:${{ needs.build.outputs.version }}${{ matrix.suffix }}
          push: true

  release:
    needs: [build, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Changelog section
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v heading="## [${VERSION}]" '
            index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next }
            /^\[[^]]*\]: / { exit }  # the link definitions at the end of the file
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION}"
            exit 1
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag --title "aliasgate ${VERSION}" --notes-file notes.md
